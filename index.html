<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/NanIdea/manifest.json">
    <link rel="icon" type="image/png" href="ink.png">
    <link rel="apple-touch-icon" href="ink.png">

    <title>Нашла Идея</title>

    <style>
              * {
                  box-sizing: border-box;
                  margin: 0;
                  padding: 0;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                  -webkit-tap-highlight-color: transparent;
              }

              body {
                  background-color: #090a0f;
                  color: #f5f6fa;
                  height: 100vh;
                  height: 100dvh;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  overflow: hidden;
              }

              .app-container {
                  width: 100%;
                  max-width: 480px;
                  height: 100vh;
                  height: 100dvh;
                  display: flex;
                  flex-direction: column;
                  padding: calc(15px + env(safe-area-inset-top, 0px)) 20px calc(15px + env(safe-area-inset-bottom, 0px)) 20px;
                  position: relative;
                  z-index: 1;
              }

              /* Шапка с элементами управления */
              .app-header {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  padding-bottom: 15px;
                  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                  flex-shrink: 0;
              }

              .brand-wrapper {
                  display: flex;
                  align-items: center;
                  gap: 10px;
              }

              .logo-title {
                  font-size: 1.25rem;
                  font-weight: 600;
                  color: #ffffff;
                  letter-spacing: -0.5px;
                  margin: 0;
              }

              .header-controls {
                  display: flex;
                  align-items: center;
                  gap: 10px;
              }

              .counter {
                  font-size: 0.85rem;
                  font-weight: 500;
                  color: rgba(255, 255, 255, 0.5);
                  background: rgba(255, 255, 255, 0.03);
                  padding: 4px 10px;
                  border-radius: 12px;
              }

              .status-dot {
                  width: 8px;
                  height: 8px;
                  border-radius: 50%;
                  transition: background-color 0.3s;
              }
              .status-dot.online { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
              .status-dot.offline { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

              /* Стилизация микрофона в шапке */
              .header-voice-btn {
                  background: rgba(255, 255, 255, 0.03);
                  border: 1px solid rgba(255, 255, 255, 0.05);
                  color: #f5f6fa;
                  width: 38px;
                  height: 38px;
                  border-radius: 12px;
                  cursor: pointer;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  transition: all 0.2s ease;
              }
              .header-voice-btn svg { fill: currentColor; width: 18px; height: 18px; }
              .header-voice-btn:active { transform: scale(0.92); }

              .header-voice-btn.listening {
                  background: #e74c3c;
                  color: #fff;
                  border-color: #e74c3c;
                  animation: pulse 1.5s infinite;
              }


              /* Главный слайдер и карточки */
              .slider-container {
                  flex: 1;
                  display: flex;
                  align-items: center;
                  position: relative;
                  margin: 15px 0;
                  width: 100%;
                  min-height: 0;
              }

              .notes-viewport {
                  flex: 1;
                  height: 100%;
                  position: relative;
                  overflow: hidden;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  z-index: 2;
              }

              .no-notes {
                  text-align: center;
                  color: rgba(255, 255, 255, 0.3);
                  font-size: 0.95rem;
                  line-height: 1.5;
                  position: absolute;
                  z-index: 1;
                  width: 100%;
                  padding: 0 10px;
              }

              .note-card {
                  position: absolute;
                  width: 100%;
                  height: 100%;
                  background: #12141c;
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  border-radius: 24px;
                  padding: 20px;
                  display: flex;
                  flex-direction: column;
                  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s;
                  opacity: 0;
                  pointer-events: none;
                  transform: translateX(100%);
                  z-index: 3;
              }

              .note-card.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
              .note-card.left { transform: translateX(-100%); }
              .note-card.right { transform: translateX(100%); }

              .note-text {
                  flex: 1;
                  background: transparent !important;
                  border: none !important;
                  color: #ffffff !important;
                  font-size: 1.1rem;
                  line-height: 1.6;
                  resize: none;
                  outline: none;
                  overflow-y: auto;
                  display: block !important;
                  min-height: 0;
              }

              .note-footer {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  margin-top: 15px;
                  padding-top: 15px;
                  border-top: 1px solid rgba(255, 255, 255, 0.05);
                  flex-shrink: 0;
              }

              .note-date {
                  background: rgba(255, 255, 255, 0.04);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  color: #ffffff;
                  padding: 6px 12px;
                  border-radius: 12px;
                  font-size: 0.85rem;
                  outline: none;
                  color-scheme: dark;
              }

              .priority-container {
                  display: none;
                  flex-direction: column;
                  gap: 4px;
              }
              .priority-badge {
                  font-size: 0.7rem;
                  font-weight: 700;
                  text-transform: uppercase;
                  padding: 3px 8px;
                  border-radius: 6px;
                  width: max-content;
              }
              .days-left { font-size: 0.75rem; font-weight: 500; }

              /* Цветовая индикация дедлайнов */
              .note-card.deadline-today { border-color: rgba(231, 76, 60, 0.4); background: linear-gradient(180deg, #12141c 0%, rgba(231, 76, 60, 0.04) 100%); }
              .note-card.deadline-today .priority-container { display: flex; }
              .note-card.deadline-today .priority-badge { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
              .note-card.deadline-today .days-left { color: #e74c3c; }

              .note-card.deadline-urgent { border-color: rgba(230, 126, 34, 0.4); background: linear-gradient(180deg, #12141c 0%, rgba(230, 126, 34, 0.03) 100%); }
              .note-card.deadline-urgent .priority-container { display: flex; }
              .note-card.deadline-urgent .priority-badge { background: rgba(230, 126, 34, 0.15); color: #e67e22; border: 1px solid rgba(230, 126, 34, 0.3); }
              .note-card.deadline-urgent .days-left { color: #e67e22; }

              .note-card.deadline-safe { border-color: rgba(46, 204, 113, 0.35); background: linear-gradient(180deg, #12141c 0%, rgba(46, 204, 113, 0.02) 100%); }
              .note-card.deadline-safe .priority-container { display: flex; }
              .note-card.deadline-safe .priority-badge { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
              .note-card.deadline-safe .days-left { color: #2ecc71; }

              /* Нижняя панель: Обновленное мобильное расположение */
              .controls-panel {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  padding-top: 15px;
                  border-top: 1px solid rgba(255, 255, 255, 0.05);
                  z-index: 10;
                  flex-shrink: 0;
                  gap: 10px;
              }

              .nav-btn {
                  background: rgba(255, 255, 255, 0.02);
                  border: 1px solid rgba(255, 255, 255, 0.04);
                  color: rgba(255, 255, 255, 0.4);
                  width: 50px;
                  height: 50px;
                  border-radius: 16px;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  flex-shrink: 0;
              }
              .nav-btn svg { fill: currentColor; width: 22px; height: 22px; }
              .nav-btn:active { transform: scale(0.92); color: #2ecc71; }

              .center-controls {
                  display: flex;
                  align-items: center;
                  gap: 15px;
              }

              .control-btn {
                  background: rgba(255, 255, 255, 0.03);
                  border: 1px solid rgba(255, 255, 255, 0.05);
                  color: #f5f6fa;
                  width: 54px;
                  height: 54px;
                  border-radius: 18px;
                  cursor: pointer;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  flex-shrink: 0;
              }
              .control-btn svg { fill: currentColor; width: 20px; height: 20px; }
              .control-btn:active { transform: scale(0.95); }

              .add-btn {
                  background: #2ecc71;
                  color: #090a0f;
                  border: none;
                  width: 64px;
                  height: 64px;
                  border-radius: 22px;
                  box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
                  flex-shrink: 0;
              }
              .add-btn svg { width: 24px; height: 24px; }
          </style>


</head>
<body>




    <div class="app-container">
        <!-- Верхняя панель: Логотип, Микрофон, Счетчик и Статус -->
        <header class="app-header">
            <div class="brand-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org" style="color: #ffffff;">
                    <path d="M3 13H6L9 4L15 20L18 11H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1 class="logo-title">NanIdea</h1>
            </div>

            <div class="header-controls">
                <button class="header-voice-btn" id="voice-btn" title="Диктовать">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                </button>
                <span class="counter" id="note-counter">0 из 0</span>
                <div id="online-status" class="status-dot online"></div>
            </div>
        </header>

        <!-- Главный контейнер отображения активных карточек -->
        <main class="slider-container">
            <div class="notes-viewport" id="notes-viewport">
                <div class="no-notes" id="no-notes-placeholder">
                    У вас пока нет заметок.<br>Нажмите «+», чтобы создать первую!
                </div>
            </div>
        </main>

        <!-- Нижняя панель: Стрелочки вынесены по бокам от плюса и корзины -->
        <footer class="controls-panel">
            <button class="nav-btn" id="prev-btn" aria-label="Предыдущая заметка">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>

            <div class="center-controls">
                <button class="control-btn add-btn" id="add-note-btn" title="Добавить">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="control-btn" id="delete-note-btn" title="Удалить">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>

            <button class="nav-btn" id="next-btn" aria-label="Следующая заметка">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </footer>
    </div>


    <script>

// Регистрируем Service Worker для полной автономности в оффлайне
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/NanIdea/sw.js')
      .then(reg => console.log('Оффлайн-режим успешно активирован!'))
      .catch(err => console.log('Ошибка активации оффлайна:', err));
  });
}



        
        let notes = [];
        let currentIndex = -1;

        const viewport = document.getElementById('notes-viewport');
        const counter = document.getElementById('note-counter');
        const placeholder = document.getElementById('no-notes-placeholder');

        // Стартовая инициализация
        function initApp() {
            try {
                const savedNotes = localStorage.getItem('ideaspace_notes');
                if (savedNotes) notes = JSON.parse(savedNotes);
            } catch (e) {
                console.error("Ошибка загрузки данных:", e);
            }
            sortAndRender(true);
        }

        // Синхронизация с локальным хранилищем
        function saveToStorage() {
            try {
                localStorage.setItem('ideaspace_notes', JSON.stringify(notes));
            } catch (e) {
                console.error("Ошибка сохранения данных:", e);
            }
        }

        // Расчет остатка дней до дедлайна
        function getDaysLeft(dateString) {
            if (!dateString) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const targetDate = new Date(dateString);
            targetDate.setHours(0, 0, 0, 0);

            if (isNaN(targetDate.getTime())) return null;

            const diffTime = targetDate - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // Ранжирование: сначала дедлайны (0-5 дней), затем остальные заметки
        function sortNotes() {
            notes.sort((a, b) => {
                const daysA = getDaysLeft(a.date);
                const daysB = getDaysLeft(b.date);

                const isPriorityA = daysA !== null && daysA >= 0 && daysA <= 5;
                const isPriorityB = daysB !== null && daysB >= 0 && daysB <= 5;

                if (isPriorityA && !isPriorityB) return -1;
                if (!isPriorityA && isPriorityB) return 1;

                if (isPriorityA && isPriorityB) return daysA - daysB;

                return (b.id || 0) - (a.id || 0);
            });
        }


        function sortAndRender(resetToFirst = false) {
            const activeNoteId = currentIndex !== -1 && notes[currentIndex] ? notes[currentIndex].id : null;
            sortNotes();

            if (resetToFirst || activeNoteId === null) {
                currentIndex = notes.length > 0 ? 0 : -1;
            } else {
                const foundIndex = notes.findIndex(n => n.id === activeNoteId);
                currentIndex = foundIndex !== -1 ? foundIndex : (notes.length > 0 ? 0 : -1);
            }
            render();
        }

        function render() {
            const oldCards = viewport.querySelectorAll('.note-card');
            oldCards.forEach(c => c.remove());

            if (notes.length === 0) {
                placeholder.style.display = 'block';
                counter.textContent = '0 из 0';
                currentIndex = -1;
                return;
            }

            placeholder.style.display = 'none';
            counter.textContent = `${currentIndex + 1} из ${notes.length}`;

            notes.forEach((note, index) => {
                const card = document.createElement('div');
                card.className = 'note-card';

                const daysLeft = getDaysLeft(note.date);
                let textDays = '';

                if (daysLeft !== null && daysLeft >= 0 && daysLeft <= 5) {
                    if (daysLeft === 0) {
                        card.classList.add('deadline-today');
                        textDays = 'Дедлайн сегодня!';
                    } else if (daysLeft >= 1 && daysLeft <= 3) {
                        card.classList.add('deadline-urgent');
                        textDays = `Осталось: ${daysLeft} дн.`;
                    } else if (daysLeft >= 4 && daysLeft <= 5) {
                        card.classList.add('deadline-safe');
                        textDays = `Осталось: ${daysLeft} дн.`;
                    }
                }

                if (index === currentIndex) card.classList.add('active');
                else if (index < currentIndex) card.classList.add('left');
                else card.classList.add('right');

                card.innerHTML = `
                    <textarea class="note-text" placeholder="Начните писать...">${note.text || ''}</textarea>
                    <div class="note-footer">
                        <div class="priority-container">
                            <span class="priority-badge">Приоритет</span>
                            <span class="days-left">${textDays}</span>
                        </div>
                        <input type="date" class="note-date" value="${note.date || ''}">
                    </div>
                `;

                card.querySelector('.note-text').addEventListener('input', (e) => {
                    notes[index].text = e.target.value;
                    saveToStorage();
                });

                card.querySelector('.note-date').addEventListener('change', (e) => {
                    notes[index].date = e.target.value;
                    saveToStorage();
                    sortAndRender(false);
                });

                viewport.appendChild(card);
            });
        }

        document.getElementById('add-note-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const newNote = { id: Date.now(), text: '', date: '' };
            notes.push(newNote);
            sortAndRender(false);
            currentIndex = notes.findIndex(n => n.id === newNote.id);
            render();
            saveToStorage();
            setTimeout(() => {
                const txt = viewport.querySelector('.note-card.active .note-text');
                if (txt) txt.focus();
            }, 50);
        });

        document.getElementById('delete-note-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (currentIndex === -1) return;
            notes.splice(currentIndex, 1);
            if (currentIndex >= notes.length) currentIndex = notes.length - 1;
            render();
            saveToStorage();
        });

        document.getElementById('prev-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        });

        document.getElementById('next-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (currentIndex < notes.length - 1) {
                currentIndex++;
                render();
            }
        });

        // --- ЖЕСТЫ СВАЙПА ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ ---
        let touchStartX = 0;
        let touchStartY = 0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.changedTouches && e.changedTouches[0]) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (!e.changedTouches || !e.changedTouches[0]) return;
            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                if (deltaX > 0 && currentIndex > 0) {
                    currentIndex--;
                    render();
                } else if (deltaX < 0 && currentIndex < notes.length - 1) {
                    currentIndex++;
                    render();
                }
            }
        }, { passive: true });

        // --- ОДНОКРАТНЫЙ ГОЛОСОВОЙ ВВОД (WEB SPEECH API) ---
        const voiceBtn = document.getElementById('voice-btn');
        const statusDot = document.getElementById('online-status');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            // Отключаем continuous, чтобы сессия завершалась сама после одной фразы
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'ru-RU';

            // Успешный перехват и деликатное добавление текста в конец
            recognition.onresult = (event) => {
                if (currentIndex === -1 || !event || !event.results) return;

                let resultText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i] && event.results[i][0] && event.results[i][0].transcript) {
                        resultText += event.results[i][0].transcript;
                    }
                }

                const textarea = viewport.querySelector('.note-card.active .note-text');
                if (textarea && resultText.trim()) {
                    // Проверяем, есть ли уже текст, чтобы аккуратно поставить пробел
                    const space = textarea.value.trim().length > 0 ? ' ' : '';
                    textarea.value = textarea.value.trim() + space + resultText.trim();

                    // Обновляем в структуре данных и сохраняем
                    notes[currentIndex].text = textarea.value;
                    saveToStorage();
                }
            };

            // Обработка ошибок со строгой защитой от undefined
            recognition.onerror = (event) => {
                const errorType = (event && event.error) ? event.error : 'unknown';
                console.warn('Speech recognition error:', errorType);

                if (errorType === 'network' || errorType === 'not-allowed') {
                    statusDot.className = 'status-dot offline';
                    switchToKeyboard();
                }
                stopListening();
            };

            // Как только фраза закончилась — диктофон корректно выключается без перезапуска
            recognition.onend = () => {
                stopListening();
            };
        }

        // Клик по микрофону
        voiceBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // Если открыто как локальный файл, оффлайн или нет поддержки API
            if (window.location.protocol === 'file:' || !recognition || !navigator.onLine) {
                statusDot.className = 'status-dot offline';
                switchToKeyboard();
                return;
            }

            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                if (currentIndex === -1) {
                    const newNote = { id: Date.now(), text: '', date: '' };
                    notes.push(newNote);
                    sortAndRender(true);
                }
                try {
                    const textarea = viewport.querySelector('.note-card.active .note-text');
                    if (textarea) textarea.focus();

                    recognition.start();
                    isListening = true;
                    voiceBtn.classList.add('listening');
                } catch (err) {
                    stopListening();
                }
            }
        });

        function stopListening() {
            isListening = false;
            voiceBtn.classList.remove('listening');
        }

        // Перевод фокуса на клавиатуру
        function switchToKeyboard() {
            if (currentIndex === -1) {
                const newNote = { id: Date.now(), text: '', date: '' };
                notes.push(newNote);
                currentIndex = 0;
                render();
            }
            setTimeout(() => {
                const textarea = viewport.querySelector('.note-card.active .note-text');
                if (textarea) {
                    textarea.focus();
                    textarea.scrollTop = textarea.scrollHeight;
                }
            }, 50);
        }

        // Проверка онлайна
        function updateOnlineStatus() {
            const isOnline = typeof navigator.onLine !== 'undefined' ? navigator.onLine : true;
            if (isOnline) {
                statusDot.className = 'status-dot online';
            } else {
                statusDot.className = 'status-dot offline';
                if (isListening && recognition) {
                    recognition.stop();
                }
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);


        // --- ПЕРЕКЛЮЧЕНИЕ ЗАМЕТОК КОЛЕСОМ МЫШИ (СКРОЛЛ) ---
let isWheeling = false; // Флаг для защиты от слишком быстрой прокрутки

viewport.addEventListener('wheel', (e) => {
    const targetTextarea = e.target.closest('.note-text');

    // Если скролл происходит внутри текстового поля заметки
    if (targetTextarea) {
        const isScrollingUp = e.deltaY < 0;
        const isScrollingDown = e.deltaY > 0;

        // Если пользователю есть куда скроллить текст вертикально внутри textarea — не переключаем карточку
        if (isScrollingDown && targetTextarea.scrollTop + targetTextarea.clientHeight < targetTextarea.scrollHeight) {
            return;
        }
        if (isScrollingUp && targetTextarea.scrollTop > 0) {
            return;
        }
    }

    // Защита от "истерического" скролла (срабатывает раз в 400мс)
    if (isWheeling) return;

    if (Math.abs(e.deltaY) > 10) { // Игнорируем микро-движения мыши
        isWheeling = true;

        if (e.deltaY > 0 && currentIndex < notes.length - 1) {
            // Скролл вниз (колесо на себя) -> Следующая заметка
            currentIndex++;
            render();
        } else if (e.deltaY < 0 && currentIndex > 0) {
            // Скролл вверх (колесо от себя) -> Предыдущая заметка
            currentIndex--;
            render();
        }

        // Сбрасываем флаг блокировки через 400 миллисекунд
        setTimeout(() => {
            isWheeling = false;
        }, 400);
    }
}, { passive: true });




        // Полный запуск приложения
        updateOnlineStatus();
        initApp();






        
    </script>
